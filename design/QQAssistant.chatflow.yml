                except Exception:
                    return default

            def main(task_ref: str, fills, missing, confidence, needs_confirm) -> dict:
                fill_list = load(fills, [])
                missing_list = load(missing, [])
                if not isinstance(fill_list, list):
                    fill_list = []
                if not isinstance(missing_list, list):
                    missing_list = []
                try:
                    conf = float(confidence)
                except (TypeError, ValueError):
                    conf = 0.0
                if isinstance(needs_confirm, str):
                    confirm = needs_confirm.lower() == "true"
                else:
                    confirm = bool(needs_confirm)
                if missing_list:
                    decision = {
                        "version": 1,
                        "action": "ASK",
                        "content": "还差这些信息：" + "、".join(str(x) for x in missing_list),
                        "ask": {"missing": [str(x) for x in missing_list],
                                "task_ref": task_ref or ""},
                    }
                else:
                    decision = {
                        "version": 1,
                        "action": "FILE_FILL",
                        "content": "填好了。",
                        "file": {"task_ref": task_ref or "", "fills": fill_list,
                                 "missing": [], "confidence": conf,
                                 "needs_confirm": confirm},
                    }
                return {"decision": json.dumps(decision, ensure_ascii=False),
                        "has_missing": "true" if missing_list else "false"}
