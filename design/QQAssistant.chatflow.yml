                {"fills":[],"missing":[],"confidence":0.0,"needs_confirm":false}

                规则：
                1. 只填 request 明确要求、且 facts 或 structure 能确定的字段；不要猜测。
                2. missing 列出 request 要求但 facts 中缺失的字段名（用表头/标签原文）。
