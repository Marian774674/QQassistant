      - data:
          code: |
            import json

            # MEMO / MEMO_CLOSE 是回滚路径（提示词已切到 MEMO_OP），保留解析但不再产出
            ALLOWED = {"SEND", "DRAFT", "SILENT", "MEMO", "FACT", "MEMO_CLOSE", "MEMO_OP"}
            CATEGORIES = {"学业", "社交", "健康", "财务", "日常", "其他"}
            OPS = {"memo.create", "memo.update", "memo.close"}
            OP_FIELDS = ("memoId", "title", "content", "importance", "category",
                         "dueTime", "clearDueTime", "status")
            SILENT = {"version": 1, "action": "SILENT"}


            def _clean_memo(memo):
                """模型偶尔写错枚举/越界分数；这里兜底，否则 Spring 侧 400 会把整条备忘丢掉。"""
                if not isinstance(memo, dict):
                    memo = {}
                out = {}
                title = str(memo.get("title") or "").strip()
                content = str(memo.get("content") or "").strip()
                due = str(memo.get("dueTime") or "").strip()
                out["title"] = title or (content[:40] or "备忘")
                if content:
                    out["content"] = content
                if due:
                    out["dueTime"] = due
                try:
                    importance = int(memo.get("importance"))
                except (TypeError, ValueError):
                    importance = 3
                out["importance"] = max(1, min(5, importance))
                category = str(memo.get("category") or "").strip()
                out["category"] = category if category in CATEGORIES else "其他"
                return out


            def _clean(value):
                return "" if value is None else str(value).strip()


            def _dump(value):
                return json.dumps(value, ensure_ascii=False)


            def _op_body(data, sender_id, chat_id, event_id):
                """把模型的 op 压成扁平字符串 body。

                身份字段（senderId / chatId / eventId）只从 Start 取：
                模型可以决定「做什么」，但绝不能决定「替谁做」，也不能决定幂等键。
                """
                if _clean(data.get("op")) not in OPS:
                    return None
                body = {
                    "eventId": _clean(event_id),
                    "op": _clean(data.get("op")),
                    "senderId": _clean(sender_id),
                    "chatId": _clean(chat_id),
                }
                for key in OP_FIELDS:
                    body[key] = _clean(data.get(key))
                return _dump(body)


            def main(text: str, sender_id: str, chat_id: str, event_id: str) -> dict:
                raw = (text or "").strip()
                if raw.startswith("```"):
                    raw = raw.strip("`")
                    if raw.startswith("json"):
                        raw = raw[4:].lstrip()

                try:
                    data = json.loads(raw)
                except Exception:
                    data = None

                if not isinstance(data, dict) or data.get("action") not in ALLOWED:
                    return {"decision": _dump(SILENT), "is_op": "false", "op_body": ""}

                if data.get("action") == "MEMO_OP":
                    body = _op_body(data, sender_id, chat_id, event_id)
                    if body is None:
                        # 模型给了非法的 op：宁可不写，也不猜
                        return {"decision": _dump(SILENT), "is_op": "false", "op_body": ""}
                    if not _clean(event_id):
                        # 没有幂等键就不写：重复执行一次改期/取消，用户是察觉不到的
                        return {"decision": _dump({"version": 1, "action": "SEND",
                                                   "text": "刚才没办成，麻烦再说一遍？"}),
                                "is_op": "false", "op_body": ""}
                    return {"decision": "", "is_op": "true", "op_body": body}

                data.setdefault("version", 1)
                if data.get("action") == "MEMO":
                    data["memo"] = _clean_memo(data.get("memo"))
                return {"decision": _dump(data), "is_op": "false", "op_body": ""}
          code_language: python3
