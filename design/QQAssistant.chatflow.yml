      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              temperature: 0.1
            mode: chat
            name: qwen-plus
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - role: system
              text: |
                你是表单填写器。根据 structure、facts 和 request，决定每个空该填什么。

                只输出一个 JSON 对象，不要 Markdown、不要解释：
                {"fills":[],"missing":[],"confidence":0.0,"needs_confirm":false}

                规则：
                1. 只填 request 明确要求、且 facts 或 structure 能确定的字段；不要猜测。
                2. missing 列出 request 要求但 facts 中缺失的字段名（用表头/标签原文）。
                3. xlsx 的 fills 格式：{"sheet":"Sheet1","ref":"B2","value":"张三"}
                   docx 的 paragraph 格式：{"kind":"paragraph","index":3,"value":"张三"}
                   docx 的 table 格式：{"kind":"table","table":0,"row":1,"col":1,"value":"2023001"}
                4. ref/index/row/col 必须来自 structure 中真实存在的坐标；拿不准就不填。
                5. confidence 取 0–1；任何字段靠推断时 ≤0.6，并置 needs_confirm=true。
                6. 不要改动无关单元格，不要新增行/列，不要改格式。
                7. request 为空、或与文件无关时，返回：
                   {"fills":[],"missing":[],"confidence":0,"needs_confirm":true}
                8. 用户要求“保留原格式/只填空”时，只输出 fills，不要描述文件内容。
            - role: user
              text: |
                structure:
                {{#start.structure#}}

                facts:
                {{#start.facts#}}

                request:
                {{#check_request.request#}}
          selected: false
          title: FILL_FILE_LLM
          type: llm
          variables: []
          vision:
            enabled: false
        height: 260
        id: fill_file_llm
        position:
          x: 1280
          y: 60
        positionAbsolute:
          x: 1280
          y: 60
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import json

            def main(text: str) -> dict:
                raw = (text or "").strip()
                if raw.startswith("```"):
                    raw = raw.strip("`")
                    if raw.startswith("json"):
                        raw = raw[4:].lstrip()
                try:
                    data = json.loads(raw)
                except Exception:
                    data = {}
                fills = data.get("fills") or []
                missing = data.get("missing") or []
                if not isinstance(fills, list):
                    fills = []
                if not isinstance(missing, list):
                    missing = []
                try:
                    confidence = float(data.get("confidence") or 0)
                except (TypeError, ValueError):
                    confidence = 0.0
                nc = data.get("needs_confirm")
                if isinstance(nc, str):
                    needs_confirm = nc.lower() == "true"
                else:
                    needs_confirm = bool(nc)
                return {"fills": fills, "missing": [str(x) for x in missing],
                        "confidence": confidence, "needs_confirm": needs_confirm}
          code_language: python3
          desc: ''
          outputs:
            confidence:
              children: null
              type: number
            fills:
              children: null
              type: array[object]
            missing:
              children: null
              type: array[string]
            needs_confirm:
              children: null
              type: boolean
          selected: false
          title: PARSE_FILL_FILE
          type: code
          variables:
            - value_selector:
                - fill_file_llm
                - text
              variable: text
        height: 200
        id: parse_fill_file
        position:
          x: 1520
          y: 60
        positionAbsolute:
          x: 1520
          y: 60
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import json

            def load(value, default):
                if isinstance(value, (list, dict)):
                    return value
                try:
                    return json.loads(value) if value else default
                except Exception:
                    return default

            def main(task_ref: str, fills, missing, confidence, needs_confirm) -> dict:
                fill_list = load(fills, [])
                missing_list = load(missing, [])
                if not isinstance(fill_list, list):
                    fill_list = []
                if not isinstance(missing_list, list):
                    missing_list = []
                try:
                    conf = float(confidence)
                except (TypeError, ValueError):
                    conf = 0.0
                if isinstance(needs_confirm, str):
                    confirm = needs_confirm.lower() == "true"
                else:
                    confirm = bool(needs_confirm)
                if missing_list:
                    decision = {
                        "version": 1,
                        "action": "ASK",
                        "content": "还差这些信息：" + "、".join(str(x) for x in missing_list),
                        "ask": {"missing": [str(x) for x in missing_list],
                                "task_ref": task_ref or ""},
                    }
                else:
                    decision = {
                        "version": 1,
                        "action": "FILE_FILL",
                        "content": "填好了。",
                        "file": {"task_ref": task_ref or "", "fills": fill_list,
                                 "missing": [], "confidence": conf,
                                 "needs_confirm": confirm},
                    }
                return {"decision": json.dumps(decision, ensure_ascii=False),
                        "has_missing": "true" if missing_list else "false"}
          code_language: python3
          desc: ''
          outputs:
            decision:
              children: null
              type: string
            has_missing:
              children: null
              type: string
          selected: false
          title: CHECK_MISSING
          type: code
          variables:
            - value_selector:
                - start
