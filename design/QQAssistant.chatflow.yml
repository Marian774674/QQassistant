      - data:
          code: |
            import json

            MAX_TEXT = 200


            def _send(text):
                return json.dumps({"version": 1, "action": "SEND",
                                   "text": text[:MAX_TEXT]}, ensure_ascii=False)


            def _payload(body):
                if isinstance(body, dict):
                    return body
                try:
                    return json.loads(body or "")
                except Exception:
                    return None


            def main(status_code: int, body: str) -> dict:
                """把 HTTP 结果翻成决策信封（前后端唯一约定）。

                全函数：任何输入都返回 SEND，绝不抛异常——抛了整条工作流会中断，
                用户连「没办成」都收不到。也不回显 body：后端细节不该出现在 QQ 里。
                """
                try:
                    code = int(status_code or 0)
                except (TypeError, ValueError):
                    code = 0
                payload = _payload(body)
                if payload is None or not 200 <= code < 300:
                    return {"decision": _send("刚才没办成，后台没连上，等会儿再说一次？")}

                message = str(payload.get("message") or "").strip()
                if payload.get("code") != 0:
                    # 业务拒绝（校验/归属/找不到）走这条：把 Spring 给的中文原因原样转达，
                    # 别改写成「没连上」，用户会以为重试就能好。
                    return {"decision": _send(message or "这次没改成，换个说法再试试？")}

                data = payload.get("data") or {}
                if data.get("replayed"):
                    message = (message or "这件事已经办过了") + "（没有重复执行）"
                return {"decision": _send(message or "办好了")}
          code_language: python3
          desc: 成功分支：把 Result 信封翻成 SEND
