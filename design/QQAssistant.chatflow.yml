                if raw.startswith("```"):
                    raw = raw.strip("`")
                    if raw.startswith("json"):
                        raw = raw[4:].lstrip()
                try:
                    data = json.loads(raw)
                except Exception:
                    data = {}
                fills = data.get("fills") or []
                missing = data.get("missing") or []
                if not isinstance(fills, list):
                    fills = []
                if not isinstance(missing, list):
                    missing = []
                try:
                    confidence = float(data.get("confidence") or 0)
                except (TypeError, ValueError):
                    confidence = 0.0
                nc = data.get("needs_confirm")
                if isinstance(nc, str):
                    needs_confirm = nc.lower() == "true"
                else:
                    needs_confirm = bool(nc)
                return {"fills": fills, "missing": [str(x) for x in missing],
                        "confidence": confidence, "needs_confirm": needs_confirm}
