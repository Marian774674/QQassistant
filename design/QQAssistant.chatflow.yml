      - data:
          code: |
            import datetime

            def main(current_time: str) -> dict:
                # 返回 float 即可：会话变量 pending_file_expires_at 的默认值是 0.1，
                # Dify 据此判成 number；若默认值是 0 会变成 integer，接口直接 400
                try:
                    now = datetime.datetime.fromisoformat(current_time).timestamp()
                except Exception:
                    now = datetime.datetime.now().timestamp()
                return {"now_epoch": now, "next_expires": now + 900}
          code_language: python3
          desc: ''
          outputs:
            next_expires:
              children: null
              type: number
            now_epoch:
              children: null
              type: number
          selected: false
          title: CLOCK
          type: code
          variables:
            - value_selector:
                - start
                - current_time
              variable: current_time
        height: 120
        id: clock
        position:
          x: 320
          y: 480
        positionAbsolute:
          x: 320
          y: 480
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: is
                  id: c0000000-0000-4000-8000-000000000001
                  value: file
                  varType: string
                  variable_selector:
                    - start
                    - event_type
              id: 'true'
              logical_operator: and
          desc: ''
          selected: false
          title: IS_FILE
          type: if-else
        height: 150
        id: is_file
        position:
          x: 560
          y: 480
        positionAbsolute:
          x: 560
          y: 480
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            def main(pending_file_request: str, pending_request_hint: str,
                     query: str, pending_file_expires_at: float,
                     now_epoch: float) -> dict:
                pending = (pending_file_request or "").strip()
                hint = (pending_request_hint or "").strip()
                inline = (query or "").strip()
                try:
                    expires = float(pending_file_expires_at or 0)
                except (TypeError, ValueError):
                    expires = 0
                valid = bool(pending or hint) and (expires == 0 or expires > float(now_epoch or 0))
                base = (pending or hint) if valid else ""
                parts = [p for p in (base, inline) if p]
                request = "\n".join(parts).strip()
                return {"has_request": "true" if request else "false", "request": request}
          code_language: python3
          desc: ''
          outputs:
            has_request:
              children: null
              type: string
            request:
              children: null
              type: string
          selected: false
          title: CHECK_REQUEST
          type: code
          variables:
            - value_selector:
                - conversation
                - pending_file_request
              variable: pending_file_request
            - value_selector:
                - start
                - pending_request_hint
              variable: pending_request_hint
            - value_selector:
                - start
                - query
              variable: query
            - value_selector:
                - conversation
                - pending_file_expires_at
              variable: pending_file_expires_at
            - value_selector:
                - clock
                - now_epoch
              variable: now_epoch
