app:
  description: QQ 消息助手 Dify Chatflow（Dify 做语义与决策，插件做执行）
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: QQAssistant
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables:
    - description: 用户先说的填写要求
      id: a0000000-0000-4000-8000-000000000001
      name: pending_file_request
      selector:
        - conversation
        - pending_file_request
      value: ''
      value_type: string
    - description: 已收到文件、等待补充信息时的 task_ref
      id: a0000000-0000-4000-8000-000000000002
      name: pending_file_task_ref
      selector:
        - conversation
        - pending_file_task_ref
      value: ''
      value_type: string
    - description: pending 请求过期时间（epoch 秒）
      id: a0000000-0000-4000-8000-000000000003
      name: pending_file_expires_at
      selector:
        - conversation
        - pending_file_expires_at
      # 必须是小数：默认值 0 会被 Dify 归一化成 value_type: integer，
      # 而 integer 无法被会话变量工厂加载，/chat-messages 直接 400
      value: 0.1
      value_type: number
    - description: none / file_request / file_input
      id: a0000000-0000-4000-8000-000000000004
      name: awaiting
      selector:
        - conversation
        - awaiting
      value: none
      value_type: string
    - description: 最近一次动作（调试）
      id: a0000000-0000-4000-8000-000000000005
      name: last_action
      selector:
        - conversation
        - last_action
      value: ''
      value_type: string
    - description: 上一轮文件任务引用
      id: a0000000-0000-4000-8000-000000000006
      name: last_task_ref
      selector:
        - conversation
        - last_task_ref
      value: ''
      value_type: string
  environment_variables:
    - description: Spring Boot 基地址：Docker 里的 Dify 用 http://host.docker.internal:8080，
        同机直跑用 http://localhost:8080
      id: a0000000-0000-4000-8000-000000000101
      name: SPRING_BASE_URL
      selector:
        - env
        - SPRING_BASE_URL
      value: http://host.docker.internal:8080
      value_type: string
    - description: /api/agent/* 的 X-Agent-Token。secret 不随 DSL 导出，导入后必须在
        Dify 控制台重新填写，否则接口一律 503。
      id: a0000000-0000-4000-8000-000000000102
      name: AGENT_OPS_TOKEN
      selector:
        - env
        - AGENT_OPS_TOKEN
      value: ''
      value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig: {}
      number_limits: 3
    opening_statement: ''
    retriever_resource:
