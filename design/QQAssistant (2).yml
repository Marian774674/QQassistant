    - data:
        code: "def main(pending_file_request: str, pending_request_hint: str,\n  \
          \       query: str, pending_file_expires_at: float,\n         now_epoch:\
          \ float) -> dict:\n    pending = (pending_file_request or \"\").strip()\n\
          \    hint = (pending_request_hint or \"\").strip()\n    inline = (query\
          \ or \"\").strip()\n    try:\n        expires = float(pending_file_expires_at\
          \ or 0)\n    except (TypeError, ValueError):\n        expires = 0\n    valid\
          \ = bool(pending or hint) and (expires == 0 or expires > float(now_epoch\
          \ or 0))\n    base = (pending or hint) if valid else \"\"\n    parts = [p\
          \ for p in (base, inline) if p]\n    request = \"\\n\".join(parts).strip()\n\
          \    return {\"has_request\": \"true\" if request else \"false\", \"request\"\
          : request}\n"
        code_language: python3
