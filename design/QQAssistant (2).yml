    - data:
        code: "import json\n\nMAX_TEXT = 200\n\n\ndef _send(text):\n    return json.dumps({\"\
          version\": 1, \"action\": \"SEND\",\n                       \"content\"\
          : text[:MAX_TEXT]}, ensure_ascii=False)\n\n\ndef _payload(body):\n    if\
          \ isinstance(body, dict):\n        return body\n    try:\n        return\
          \ json.loads(body or \"\")\n    except Exception:\n        return None\n\
          \n\ndef main(status_code: int, body: str) -> dict:\n    \"\"\"把 HTTP 结果翻成决策信封（前后端唯一约定）。\n\
          \n    全函数：任何输入都返回 SEND，绝不抛异常——抛了整条工作流会中断，\n    用户连「没办成」都收不到。也不回显 body：后端细节不该出现在\
          \ QQ 里。\n    \"\"\"\n    try:\n        code = int(status_code or 0)\n  \
          \  except (TypeError, ValueError):\n        code = 0\n    payload = _payload(body)\n\
          \    if payload is None or not 200 <= code < 300:\n        return {\"decision\"\
          : _send(\"刚才没办成，后台没连上，等会儿再说一次？\")}\n\n    message = str(payload.get(\"message\"\
          ) or \"\").strip()\n    if payload.get(\"code\") != 0:\n        # 业务拒绝（校验/归属/找不到）走这条：把\
          \ Spring 给的中文原因原样转达，\n        # 别改写成「没连上」，用户会以为重试就能好。\n        return {\"\
          decision\": _send(message or \"这次没改成，换个说法再试试？\")}\n\n    data = payload.get(\"\
          data\") or {}\n    if data.get(\"replayed\"):\n        message = (message\
          \ or \"这件事已经办过了\") + \"（没有重复执行）\"\n    return {\"decision\": _send(message\
          \ or \"办好了\")}\n"
        code_language: python3
