    - data:
        code: "import json\n\n# MEMO / MEMO_CLOSE 是回滚路径（提示词已切到 MEMO_OP），保留解析但不再产出\n\
          ALLOWED = {\"SEND\", \"DRAFT\", \"SILENT\", \"MEMO\", \"FACT\", \"MEMO_CLOSE\"\
          , \"MEMO_OP\"}\nCATEGORIES = {\"学业\", \"社交\", \"健康\", \"财务\", \"日常\", \"\
          其他\"}\nOPS = {\"memo.create\", \"memo.update\", \"memo.close\"}\nOP_FIELDS\
          \ = (\"memoId\", \"title\", \"content\", \"importance\", \"category\",\n\
          \             \"dueTime\", \"clearDueTime\", \"status\")\nSILENT = {\"version\"\
          : 1, \"action\": \"SILENT\"}\n\n\ndef _clean_memo(memo):\n    \"\"\"模型偶尔写错枚举/越界分数；这里兜底，否则\
          \ Spring 侧 400 会把整条备忘丢掉。\"\"\"\n    if not isinstance(memo, dict):\n   \
          \     memo = {}\n    out = {}\n    title = str(memo.get(\"title\") or \"\
          \").strip()\n    content = str(memo.get(\"content\") or \"\").strip()\n\
          \    due = str(memo.get(\"dueTime\") or \"\").strip()\n    out[\"title\"\
          ] = title or (content[:40] or \"备忘\")\n    if content:\n        out[\"content\"\
          ] = content\n    if due:\n        out[\"dueTime\"] = due\n    try:\n   \
          \     importance = int(memo.get(\"importance\"))\n    except (TypeError,\
          \ ValueError):\n        importance = 3\n    out[\"importance\"] = max(1,\
          \ min(5, importance))\n    category = str(memo.get(\"category\") or \"\"\
          ).strip()\n    out[\"category\"] = category if category in CATEGORIES else\
          \ \"其他\"\n    return out\n\n\ndef _clean(value):\n    return \"\" if value\
          \ is None else str(value).strip()\n\n\ndef _dump(value):\n    return json.dumps(value,\
          \ ensure_ascii=False)\n\n\ndef _op_body(data, sender_id, chat_id, event_id):\n\
          \    \"\"\"把模型的 op 压成扁平字符串 body。\n\n    身份字段（senderId / chatId / eventId）只从\
          \ Start 取：\n    模型可以决定「做什么」，但绝不能决定「替谁做」，也不能决定幂等键。\n    \"\"\"\n    if _clean(data.get(\"\
          op\")) not in OPS:\n        return None\n    body = {\n        \"eventId\"\
          : _clean(event_id),\n        \"op\": _clean(data.get(\"op\")),\n       \
          \ \"senderId\": _clean(sender_id),\n        \"chatId\": _clean(chat_id),\n\
          \    }\n    for key in OP_FIELDS:\n        body[key] = _clean(data.get(key))\n\
          \    return _dump(body)\n\n\ndef main(text: str, sender_id: str, chat_id:\
          \ str, event_id: str) -> dict:\n    raw = (text or \"\").strip()\n    if\
          \ raw.startswith(\"```\"):\n        raw = raw.strip(\"`\")\n        if raw.startswith(\"\
          json\"):\n            raw = raw[4:].lstrip()\n\n    try:\n        data =\
          \ json.loads(raw)\n    except Exception:\n        data = None\n\n    if\
          \ not isinstance(data, dict) or data.get(\"action\") not in ALLOWED:\n \
          \       return {\"decision\": _dump(SILENT), \"is_op\": \"false\", \"op_body\"\
          : \"\"}\n\n    if data.get(\"action\") == \"MEMO_OP\":\n        body = _op_body(data,\
          \ sender_id, chat_id, event_id)\n        if body is None:\n            #\
          \ 模型给了非法的 op：宁可不写，也不猜\n            return {\"decision\": _dump(SILENT),\
          \ \"is_op\": \"false\", \"op_body\": \"\"}\n        if not _clean(event_id):\n\
          \            # 没有幂等键就不写：重复执行一次改期/取消，用户是察觉不到的\n            return {\"decision\"\
          : _dump({\"version\": 1, \"action\": \"SEND\",\n                       \
          \                \"text\": \"刚才没办成，麻烦再说一遍？\"}),\n                    \"\
          is_op\": \"false\", \"op_body\": \"\"}\n        return {\"decision\": \"\
          \", \"is_op\": \"true\", \"op_body\": body}\n\n    data.setdefault(\"version\"\
          , 1)\n    if data.get(\"action\") == \"MEMO\":\n        data[\"memo\"] =\
          \ _clean_memo(data.get(\"memo\"))\n    return {\"decision\": _dump(data),\
          \ \"is_op\": \"false\", \"op_body\": \"\"}\n"
