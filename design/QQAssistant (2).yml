    - data:
        code: "import datetime\n\ndef main(current_time: str) -> dict:\n    # 返回 float\
          \ 即可：会话变量 pending_file_expires_at 的默认值是 0.1，\n    # Dify 据此判成 number；若默认值是\
          \ 0 会变成 integer，接口直接 400\n    try:\n        now = datetime.datetime.fromisoformat(current_time).timestamp()\n\
          \    except Exception:\n        now = datetime.datetime.now().timestamp()\n\
          \    return {\"now_epoch\": now, \"next_expires\": now + 900}\n"
        code_language: python3
        desc: ''
        outputs:
          next_expires:
            children: null
            type: number
          now_epoch:
            children: null
            type: number
