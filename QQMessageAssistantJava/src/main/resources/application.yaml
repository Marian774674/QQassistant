server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://192.168.100.128:3307/qq_assistant?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
langbot:
  base-url: http://localhost:5300
  connect-timeout-ms: 3000
  read-timeout-ms: 8000

app:
  reminder:
    enabled: true
    scan-interval-ms: 60000
    batch-size: 50