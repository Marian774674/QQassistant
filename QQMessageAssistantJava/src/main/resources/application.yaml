server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://192.168.100.128:3307/qq_assistant?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
langbot:
  # 指向主动发送桥（QQMessageAssistantPython/send_bridge），不是 LangBot 官方端口
  base-url: http://192.168.100.128:5301
  connect-timeout-ms: 2000
  # 桥内最坏耗时 = DELAY_MAX_MS(15000) + HTTP_TIMEOUT(10000) = 25s；
  # 读超时必须大于它，否则 Java 先超时回滚、桥随后仍发出 → 用户重试就会重复发送
  read-timeout-ms: 35000

app:
  agent:
    # Dify HTTP 节点调用 /api/agent/* 时携带的 X-Agent-Token。
    # 留空 = 该入口整体关闭（503），所以必须从环境变量注入，别把值写进仓库。
    token: ${AGENT_OPS_TOKEN:}
  reminder:
    # 提醒调度：到点扫描 memo_reminder 并经发送桥推 QQ。
    # 关掉后备忘仍可创建、提醒仍会入库，只是不会推送。
    enabled: true
    scan-interval-ms: 60000
    batch-size: 50