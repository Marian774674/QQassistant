apiVersion: v1
kind: Plugin
metadata:
  author: Marian
  name: qq_assistant_plugin
  repository: ''
  version: 0.2.32
  description:
    en_US: nothing
    zh_Hans: nothing
    th_TH: nothing
    vi_VN: nothing
    es_ES: nothing
  label:
    en_US: qq assistant plugin
    zh_Hans: qq assistant plugin
    th_TH: qq assistant plugin
    vi_VN: qq assistant plugin
    es_ES: qq assistant plugin
  icon: assets/icon.svg
spec:
  config:
    - name: spring_base_url
      type: string
      label: { zh_Hans: Spring Boot 地址 }
      default: http://localhost:8080
    - name: spring_timeout
      type: float
      label: { zh_Hans: Spring Boot 超时时间 }
    - name: spring_agent_token
      type: string
      label: { zh_Hans: "Spring Agent Token（与后端 AGENT_OPS_TOKEN 相同；不填则所有接口 401）" }
      default: ''
    - name: dify_base_url
      type: string
      label: { zh_Hans: Dify API 地址（到 /v1） }
      default: http://127.0.0.1/v1
    - name: dify_api_key
      type: string
      label: { zh_Hans: Dify App API Key }
      required: true
    - name: dify_timeout
      type: float
      label: { zh_Hans: 连接 Dify 超时时间 }
    - name: dify_file_workflow_key
      type: string
      label: { zh_Hans: Dify 文件工作流 API Key }
    - name: token_usage_enabled
      type: select
      label: { zh_Hans: "Token 用量上报（把 Dify 调用记进网页只读账本，旁路、不影响回复）" }
      default: "true"
      options:
        - name: "true"
          label: { zh_Hans: 开启, en_US: On }
        - name: "false"
          label: { zh_Hans: 关闭, en_US: Off }
    - name: dify_chat_model
      type: string
      label: { zh_Hans: "模型标注（Dify 不回传模型名，仅用于账本显示；留空=未标注）" }
      default: ''
    - name: file_confirm_threshold
      type: float
      label: { zh_Hans: 文件回写置信度阈值 }
      default: 0.85
    - name: napcat_api_url
      type: string
      label: { zh_Hans: "NapCat HTTP API 地址（如 http://127.0.0.1:3000，留空禁用文件下载）" }
      default: 'http://127.0.0.1:3000'
    - name: napcat_token
      type: string
      label: { zh_Hans: NapCat HTTP API Token }
      default: ''
    - name: napcat_backfill_enabled
      type: select
      label: { zh_Hans: "掉线补拉（NapCat 重新上线后回查历史，只写日志、不回复）" }
      default: "true"
      options:
        - name: "true"
          label: { zh_Hans: 开启, en_US: On }
        - name: "false"
          label: { zh_Hans: 关闭, en_US: Off }
    - name: napcat_backfill_interval_s
      type: int
      label: { zh_Hans: 掉线补拉：在线状态轮询间隔（秒） }
      default: 10
    - name: napcat_backfill_start_delay_s
      type: int
      label: { zh_Hans: 掉线补拉：插件启动后延迟多久开始探测（秒） }
      default: 10
    - name: napcat_backfill_sweep_s
      type: int
      label: { zh_Hans: "掉线补拉：兜底回查间隔（秒）。即使没探到掉线也会周期性补一次，覆盖登录过期 / WS 断开" }
      default: 300
    - name: bot
      type: bot-selector
      label: { zh_Hans: 使用的机器人 }
      required: true
    - name: bot_qq
      type: string
      label: { zh_Hans: 机器人 QQ 号（用于识别 @） }
      required: true
    - name: group_prefix
      type: string
      label: { zh_Hans: 群聊触发前缀 }
      default: "!"
    - name: fact_auto_threshold
      type: float
      label: { zh_Hans: 事实自动写入置信度阈值 }
      default: 0.85
    - name: delay_base_ms
      type: int
      label: { zh_Hans: 延迟基础时间（毫秒） }
    - name: delay_per_char_ms
      type: int
      label: { zh_Hans: 每字符延迟时间（毫秒） }
    - name: delay_jitter_ms
      type: int
      label: { zh_Hans: 延迟抖动时间（毫秒） }
    - name: delay_max_ms
      type: int
      label: { zh_Hans: 延迟最大时间（毫秒） }
    - name: data_dir
      type: string
      label: { zh_Hans: "插件数据目录（留空=自动探测可写目录：LangBot data/qq_assistant，其次用户目录）" }
      default: ''
  components:
    EventListener:
      fromDirs:
      - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: qqassistantplugin
